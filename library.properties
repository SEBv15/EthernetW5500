sentence=Project-local W5500 Ethernet library, forked from Ethernet3 1.6.0.
paragraph=Adds first-class support for the workarounds the ring_light project depends on: PHY auto-negotiation fallback, configurable W5500 startup delay, configurable DHCP timeouts, hardware-presence detection, sticky per-socket interrupt mask, and EthernetServer::accept() with yield-once semantics. Not intended as a drop-in replacement for upstream Ethernet3.
